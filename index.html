<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14; --surface:#121722; --surface2:#181E2B; --line:rgba(255,255,255,.07);
  --text:#ECE9E3; --muted:#8B91A1; --faint:#5A6070;
  --cool:111,143,224; --warm:227,181,98; --neg:214,122,122; --pos:126,196,160;
  --accent:169,162,161; /* JS ile güncellenir */
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}

.app{position:relative;width:100%;max-width:430px;min-height:100vh;overflow:hidden;padding-bottom:180px}
.glow{position:absolute;inset:-120px -80px auto;height:460px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(var(--accent),.28),rgba(var(--accent),0));
  transition:background 1.6s ease;filter:blur(10px)}
.screen{position:relative;padding:calc(env(safe-area-inset-top) + 22px) 20px 0;display:none;animation:fade .5s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between}
.mark{font-family:var(--serif);font-size:22px;letter-spacing:.18em;font-weight:400}
.mark span{color:rgb(var(--accent));transition:color 1.6s}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 11px;display:flex;gap:6px;align-items:center}
.pill b{color:var(--text);font-weight:500}
.date{margin-top:34px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hello{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.15;margin-top:8px}
.hello em{font-style:italic;color:rgb(var(--accent));transition:color 1.6s}

/* cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.state{display:flex;gap:18px;align-items:center;margin-top:26px}
.orb{width:74px;height:74px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(var(--accent),.9) 38%,rgba(var(--accent),.15) 75%);
  box-shadow:0 0 50px rgba(var(--accent),.35);transition:all 1.6s;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.bars{flex:1;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:78px 1fr 18px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.track{height:4px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:4px;background:rgb(var(--accent));transition:width .8s,background 1.6s}
.bar i{font-style:normal;color:var(--text);text-align:right}

.intent{font-family:var(--serif);font-size:21px;font-weight:300;margin-top:8px;line-height:1.3}
.status{font-size:12px;color:var(--muted);margin-top:10px}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.cta .arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.cta.hot .arrow{border-color:rgba(var(--accent),.6);color:rgb(var(--accent))}

.moments{margin-top:6px}
.m{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.sig{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600}
.sig.p{background:rgba(var(--pos),.12);color:rgb(var(--pos))}
.sig.n{background:rgba(var(--neg),.12);color:rgb(var(--neg))}
.m p{font-size:14px;line-height:1.35}
.m small{font-size:11px;color:var(--faint)}
.empty{font-size:13px;color:var(--faint);padding:8px 0 2px}

.ai{border-color:rgba(var(--accent),.25)}
.ai .txt{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.55;margin-top:10px;white-space:pre-line}
.ai .txt::after{content:'';}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:0 20px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(180deg,rgba(11,14,20,0),var(--bg) 35%);z-index:5}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:30px}
.qb{height:58px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--muted);transition:transform .15s}
.qb:active{transform:scale(.97)}
.qb b{font-size:22px;font-weight:400}
.qb.p b{color:rgb(var(--pos))} .qb.n b{color:rgb(var(--neg))}
.nav{display:flex;justify-content:center;gap:42px;margin-top:14px}
.nav button{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:6px 2px;border-bottom:1px solid transparent}
.nav button.on{color:var(--text);border-color:rgb(var(--accent))}
.screen-ben ~ .dock .quick{display:none}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(4,6,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;transform:translate(-50%,100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:12px 22px calc(env(safe-area-inset-bottom) + 24px);z-index:11;max-height:88vh;overflow:auto;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 18px}
.sheet h2{font-family:var(--serif);font-weight:300;font-size:26px}
.sheet .sub{font-size:13px;color:var(--muted);margin-top:6px}
.field{margin-top:22px}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:14px;transition:all .2s}
.seg button.on{border-color:rgba(var(--accent),.7);color:var(--text);background:rgba(var(--accent),.12)}
.seg.sign button.on.p{border-color:rgba(var(--pos),.7);background:rgba(var(--pos),.12)}
.seg.sign button.on.n{border-color:rgba(var(--neg),.7);background:rgba(var(--neg),.12)}
.inp{width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;outline:none;resize:none}
.inp:focus{border-color:rgba(var(--accent),.6)}
textarea.inp{min-height:110px;font-family:var(--serif);font-weight:300;font-size:16px;line-height:1.5}
.q{font-family:var(--serif);font-style:italic;font-weight:300;font-size:19px;margin-top:10px;line-height:1.35}
.save{width:100%;height:54px;margin-top:24px;border-radius:16px;background:rgb(var(--accent));color:#0B0E14;font-weight:600;font-size:15px;transition:background 1.6s,opacity .2s}
.save:disabled{opacity:.35}
.thinking{display:flex;gap:6px;margin-top:14px}
.thinking i{width:6px;height:6px;border-radius:50%;background:rgb(var(--accent));animation:dot 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ben */
.h1{font-family:var(--serif);font-weight:300;font-size:32px;margin-top:30px}
.note{font-size:12px;color:var(--faint);margin-top:6px}
.inf{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;padding:9px 0;font-size:14px}
.inf .track{height:6px}
.inf .fill.n{background:rgb(var(--neg))} .inf .fill.p{background:rgb(var(--pos))}
.pattern{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.45;padding:12px 0;border-top:1px solid var(--line)}
.pattern:first-of-type{border-top:0}
.streak{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:14px}
.streak i{aspect-ratio:1;border-radius:6px;background:var(--surface2)}
.streak i.y{background:rgb(var(--accent))} .streak i.h{background:rgba(var(--accent),.4)}
.goal{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.goal:first-of-type{border-top:0}
.goal span{color:var(--muted);font-size:12px}

/* header actions */
.acts{display:flex;gap:8px;align-items:center}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:15px}

/* kilit */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .4s}
.lock.off{opacity:0;pointer-events:none}
.lock .mark{font-size:30px}
.lock .hint{font-size:13px;color:var(--muted);min-height:18px}
.dots{display:flex;gap:16px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);transition:all .15s}
.dots i.f{background:rgb(var(--accent));border-color:rgb(var(--accent))}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:300}
.pad button:active{background:var(--surface2)}
.pad button.ghost{border:0;background:none;font-size:14px;color:var(--muted)}
.login{width:100%;max-width:320px;padding:0 20px;display:grid;gap:2px}
.login .save{margin-top:14px}
.lock .link{font-size:12px;color:var(--faint);text-decoration:underline}

/* mikrofon */
.inwrap{position:relative}
.inwrap .inp{padding-right:52px}
.mic{position:absolute;right:8px;top:18px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.mic.rec{color:#0B0E14;background:rgb(var(--neg));border-color:transparent;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(var(--neg),.15)}}

/* ayarlar */
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-size:14px;gap:12px}
.set:first-of-type{border-top:0}
.set small{display:block;color:var(--faint);font-size:12px;margin-top:3px}
.set input[type=time]{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color-scheme:dark}
.tog{width:46px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:all .2s}
.tog.on{background:rgba(var(--accent),.35)} .tog.on::after{left:21px;background:rgb(var(--accent))}
.btn2{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:13px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-80px);background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:13px;z-index:60;transition:transform .35s;max-width:90%}
.toast.on{transform:translate(-50%,0)}

/* geçmişteki sen */
.past .when{font-family:var(--serif);font-style:italic;font-weight:300;font-size:15px;color:rgb(var(--accent));margin-top:8px}
.past .quote{font-family:var(--serif);font-weight:300;font-size:18px;line-height:1.45;margin-top:8px}
.past .meta{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.past .meta b{color:var(--text);font-weight:500}

/* mektuplar */
.letter{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.letter:first-of-type{border-top:0}
.letter .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none;font-size:15px}
.letter.ready .ic{background:rgba(var(--accent),.18)}
.letter p{font-size:14px}
.letter small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.letter.ready small{color:rgb(var(--accent))}
.ready-card{border-color:rgba(var(--accent),.45);background:linear-gradient(135deg,rgba(var(--accent),.12),rgba(var(--accent),0) 60%),var(--surface)}
.paper{font-family:var(--serif);font-weight:300;font-size:18px;line-height:1.6;white-space:pre-line;margin-top:18px;padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="glow"></div>

  <!-- BUGÜN -->
  <section class="screen on" id="s-bugun">
    <div class="top">
      <div class="mark">M<span>E</span></div>
      <div class="acts"><div class="pill">istikrar <b id="streakN">12</b> gün</div><button class="gear" data-settings aria-label="Ayarlar">⚙</button></div>
    </div>
    <div class="date" id="date"></div>
    <h1 class="hello" id="hello"></h1>

    <div class="state">
      <div class="orb"></div>
      <div class="bars" id="bars"></div>
    </div>

    <div id="letterReady"></div>

    <div class="card">
      <button class="cta" id="morningCta">
        <div>
          <div class="label">Bugünün tek işi</div>
          <div class="intent" id="intent"></div>
          <div class="status" id="intentStatus"></div>
        </div>
        <div class="arrow">✎</div>
      </button>
    </div>

    <div class="card">
      <div class="row"><div class="label">Bugünün anları</div><div class="label" id="mCount"></div></div>
      <div class="moments" id="moments"></div>
    </div>

    <div class="card" id="eveningCard">
      <button class="cta hot" id="eveningCta">
        <div>
          <div class="label">Akşam yüzleşmesi</div>
          <div class="intent">Günü kapat, ME yorumlasın.</div>
        </div>
        <div class="arrow">→</div>
      </button>
    </div>

    <div class="card ai" id="aiCard" style="display:none">
      <div class="label">ME'nin yorumu</div>
      <div class="txt" id="aiTxt"></div>
    </div>

    <div class="card past" id="pastCard"></div>
  </section>

  <!-- BEN -->
  <section class="screen" id="s-ben">
    <div class="top">
      <div class="mark">M<span>E</span></div>
      <div class="acts"><div class="pill">son 30 gün</div><button class="gear" data-settings aria-label="Ayarlar">⚙</button></div>
    </div>
    <h1 class="h1">Seni etkileyenler</h1>
    <div class="note">Şimdilik örnek — yapay zekâ bağlanınca senin verinden hesaplanacak.</div>

    <div class="card">
      <div class="label">Moralini bozanlar</div>
      <div id="negList" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="label">Sana iyi gelenler</div>
      <div id="posList" style="margin-top:8px"></div>
    </div>
    <div class="card ai">
      <div class="label">Fark edilen örüntüler</div>
      <div style="margin-top:6px" id="patterns"></div>
    </div>
    <div class="card">
      <div class="row"><div class="label">İstikrar · son 14 gün</div><div class="label" id="keptLbl"></div></div>
      <div class="streak" id="streak"></div>
    </div>
    <div class="card">
      <div class="row"><div class="label">Gelecekteki sana</div><button class="btn2" id="writeLetter" style="height:34px">+ Mektup yaz</button></div>
      <div style="margin-top:8px" id="letters"></div>
    </div>
    <div class="card">
      <div class="label">Hedefler</div>
      <div style="margin-top:6px" id="goals"></div>
    </div>
  </section>

  <div class="dock">
    <div class="quick" id="quick">
      <button class="qb n" data-sign="n"><b>−</b> bozdu</button>
      <button class="qb p" data-sign="p"><b>+</b> iyi geldi</button>
    </div>
    <nav class="nav">
      <button class="on" data-go="bugun">Bugün</button>
      <button data-go="ben">Ben</button>
    </nav>
  </div>
</div>

<div class="lock" id="lock">
  <div class="mark">M<span>E</span></div>
  <div class="dots" id="dots" style="display:none"><i></i><i></i><i></i><i></i></div>
  <div class="hint" id="lockHint">Yükleniyor…</div>
  <div class="pad" id="pad" style="display:none"></div>
  <form class="login" id="login" style="display:none">
    <input class="inp" id="lgEmail" type="email" autocomplete="username" placeholder="E-posta">
    <input class="inp" id="lgPass" type="password" autocomplete="current-password" placeholder="Şifre">
    <button class="save" id="lgBtn" type="submit">Giriş yap</button>
  </form>
</div>
<div class="toast" id="toast"></div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script type="module">
/* ---------- FIREBASE ---------- */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, doc, getDoc, setDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// Bu değerler gizli değil; veriyi Firestore güvenlik kuralları korur.
const firebaseConfig = {
  apiKey: 'AIzaSyAqvFr1noA-E6a2y1ASh3Mn77EXU9fhakQ',
  authDomain: 'myself-1cc20.firebaseapp.com',
  projectId: 'myself-1cc20',
  storageBucket: 'myself-1cc20.firebasestorage.app',
  messagingSenderId: '611476263015',
  appId: '1:611476263015:web:6be6d61c7de70eaee404c2',
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, { localCache: persistentLocalCache() }); // çevrimdışı da çalışır, sonra senkronlar
let UID = null;

/* ---------- STATE ---------- */
const S = {
  name: 'Dostum',
  streak: 0,
  morning: null,
  intention: { text: '', done: null },
  moments: [],
  evening: null,
  settings: { morning: '09:00', evening: '21:30', nudge: true, autolock: true },
  goals: [['Tezi bitirmek', 'bu dönem'], ['Kendi markam — bootcut', 'fikir aşaması'], ['Düzenli antrenman', 'haftada 4']],
  history: [],   // geçmiş günler (bugün hariç)
  letters: [],
};
window.S = S; // hata ayıklama için

/* ---------- KAYIT KATMANI ----------
   users/{uid}/days/{YYYY-MM-DD} · users/{uid}/letters/{id} · users/{uid}/meta/main */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uref = (...p) => doc(db, 'users', UID, ...p);
const safe = p => p.catch(e => { console.error(e); toast('Kaydedilemedi — bağlantını kontrol et'); });
const saveDay = () => safe(setDoc(uref('days', dayKey()), {
  morning: S.morning, intention: S.intention, moments: S.moments, evening: S.evening, updatedAt: new Date().toISOString() }));
const saveMeta = () => safe(setDoc(uref('meta', 'main'), { name: S.name, settings: S.settings, goals: S.goals }));
const saveLetter = l => safe(setDoc(uref('letters', String(l.id)), l));

async function loadAll(){
  const [meta, days, letters] = await Promise.all([
    getDoc(uref('meta', 'main')),
    getDocs(collection(db, 'users', UID, 'days')),
    getDocs(collection(db, 'users', UID, 'letters')),
  ]);
  if (meta.exists()) { const m = meta.data(); S.name = m.name || S.name; Object.assign(S.settings, m.settings || {}); if (m.goals) S.goals = m.goals; }
  const today = dayKey();
  S.history = [];
  days.forEach(d => {
    const x = d.data();
    if (d.id === today) {
      S.morning = x.morning || null; S.intention = x.intention || { text:'', done:null };
      S.moments = x.moments || []; S.evening = x.evening || null;
    } else {
      S.history.push({ date: d.id, mood: x.morning?.mood, motivation: x.morning?.motivation, stress: x.morning?.stress,
        intention: x.intention?.text || '', done: x.intention?.done ?? null, note: x.evening?.answer || '', moments: x.moments || [] });
    }
  });
  S.history.sort((a, b) => a.date.localeCompare(b.date));
  S.letters = []; letters.forEach(l => S.letters.push(l.data()));
}

/* İstikrar: sözünü (tam ya da kısmen) tuttuğun ardışık günler */
function keptSet(){
  const s = new Set(S.history.filter(h => h.done === 'yes' || h.done === 'part').map(h => h.date));
  if (S.intention.done === 'yes' || S.intention.done === 'part') s.add(dayKey());
  return s;
}
function computeStreak(){
  const kept = keptSet(), d = new Date(); let n = 0;
  if (!kept.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (kept.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

const QUESTIONS = [
  'Bugün seni en çok ne zorladı?',

/* ---------- YARDIMCILAR ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date().toTimeString().slice(0,5);
const COOL = [111,143,224], WARM = [227,181,98];

/* Günün skoru 0..1 → vurgu rengi soğuk maviden sıcak altına */
function dayScore(){
  const m = S.morning;
  let base = m ? ((m.mood - 1) + (m.motivation - 1) + (5 - m.stress)) / 12 : 0.5;
  const delta = S.moments.reduce((a, x) => a + (x.sign === 'p' ? 1 : -1) * x.power, 0);
  return Math.max(0, Math.min(1, base + delta * 0.05));
}
function paint(){
  const t = dayScore();
  const c = COOL.map((v, i) => Math.round(v + (WARM[i] - v) * t));
  document.documentElement.style.setProperty('--accent', c.join(','));
}

  $('moments').innerHTML = ms.length

/* ---------- YAPAY ZEKÂ KATMANI ----------
   Sağlayıcı henüz seçilmedi. Uygulamanın geri kalanı sadece bu fonksiyonu çağırır.
   Gerçek sürümde: Supabase Edge Function → Claude / Gemini (anahtar sunucuda kalır).
   Şimdilik kural tabanlı sahte yorum üretir. */
const AI_PROVIDER = 'mock'; // 'claude' | 'gemini' | 'mock'

async function getAIComment(day){
  if (AI_PROVIDER !== 'mock') {
    // const r = await fetch(EDGE_URL, { method:'POST', body: JSON.stringify(day) });
    // return (await r.json()).comment;
  }
  await new Promise(r => setTimeout(r, 1400));
  const neg = day.moments.filter(x => x.sign === 'n'), pos = day.moments.filter(x => x.sign === 'p');
  const topNeg = [...neg].sort((a,b) => b.power - a.power)[0];
  const topPos = [...pos].sort((a,b) => b.power - a.power)[0];
  const lines = [];
  lines.push(`Bugün ${pos.length} iyi, ${neg.length} zor an yakaladın.`);
  if (topNeg) lines.push(`En çok “${topNeg.text}” bozdu.`);
  if (topPos) lines.push(`Buna karşın “${topPos.text}” iyi geldi.`);
  lines.push({ yes:'Sözünü tuttun. Seri devam ediyor.', part:'Kısmen yaptın — sıfır değil. Yarın kalan kısmı ilk iş olarak koymaya ne dersin?', no:'Bugün olmadı. Seni ne durdurdu? Suçlamak için değil, anlamak için soruyorum.' }[day.intention.done] || '');
  lines.push('(Yapay zekâ henüz bağlı değil — bu basit bir taslak yorum.)');
  return lines.filter(Boolean).join('\n\n');
}

/* ---------- GİRİŞ + KİLİT ----------
   1) Firebase hesabıyla giriş (bir kere, cihaz hatırlar)
   2) Cihaza özel 4 haneli PIN — sadece hash'i bu cihazda saklanır, buluta gitmez.
   Face ID için ileride WebAuthn (passkey) eklenebilir. */
let entry = '', hiddenAt = 0, pinMode = 'unlock', pinFirst = '';
const pinKey = () => 'me_pin_' + UID;
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(UID + ':' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const hasPin = () => !!lsGet(pinKey());
function showLock(mode, hint){
  pinMode = mode; entry = ''; drawDots();
  $('login').style.display = 'none';
  $('dots').style.display = ''; $('pad').style.display = '';
  $('lockHint').textContent = hint;
  $('lock').classList.remove('off');
}
function showLogin(msg){
  $('dots').style.display = 'none'; $('pad').style.display = 'none';
  $('login').style.display = '';
  $('lockHint').textContent = msg || 'Hesabınla giriş yap';
  $('lock').classList.remove('off');
}
function unlock(){ $('lock').classList.add('off'); $('lockHint').textContent = ''; }
$('login').onsubmit = async e => {
  e.preventDefault();
  $('lgBtn').disabled = true; $('lockHint').textContent = 'Giriş yapılıyor…';
  try { await signInWithEmailAndPassword(auth, $('lgEmail').value.trim(), $('lgPass').value); }
  catch(err) { $('lockHint').textContent = 'E-posta ya da şifre hatalı'; }
  $('lgBtn').disabled = false;
};
onAuthStateChanged(auth, async user => {
  if (!user) { UID = null; return showLogin(); }
  UID = user.uid;
  $('login').style.display = 'none'; $('lockHint').textContent = 'Yükleniyor…';
  try { await loadAll(); } catch(e) { console.error(e); toast('Veriler yüklenemedi'); }
  renderToday(); renderBen();
  hasPin() ? showLock('unlock', '') : showLock('set1', 'Bu cihaz için 4 haneli bir PIN belirle');
});
function buildPad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('pad').innerHTML = keys.map(k => k === '' ? '<span></span>' : `<button class="${k==='⌫'?'ghost':''}" data-k="${k}">${k}</button>`).join('');
  $('pad').querySelectorAll('button').forEach(b => b.onclick = () => press(b.dataset.k));
}
function drawDots(){ $('dots').querySelectorAll('i').forEach((d, i) => d.classList.toggle('f', i < entry.length)); }
function press(k){
  if (k === '⌫') entry = entry.slice(0, -1);
  else if (entry.length < 4) entry += k;
  drawDots();
  if (entry.length === 4) setTimeout(async () => {
    const pin = entry; entry = ''; drawDots();
    const fail = msg => { $('dots').classList.add('shake'); $('lockHint').textContent = msg; setTimeout(() => $('dots').classList.remove('shake'), 400); };
    if (pinMode === 'set1') { pinFirst = pin; pinMode = 'set2'; $('lockHint').textContent = 'Tekrar gir'; }
    else if (pinMode === 'set2') {
      if (pin !== pinFirst) { pinMode = 'set1'; return fail('Eşleşmedi, baştan belirle'); }
      lsSet(pinKey(), await hashPin(pin)); unlock(); toast('PIN belirlendi');
    }
    else if (await hashPin(pin) === lsGet(pinKey())) unlock();
    else fail('Yanlış PIN');
  }, 120);
}
function lockNow(){ if (UID && hasPin()) showLock('unlock', ''); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (S.settings.autolock && hiddenAt && Date.now() - hiddenAt > 30000) lockNow(); // 30 sn arka planda kaldıysa kilitle
});
document.addEventListener('keydown', e => {
  if ($('lock').classList.contains('off') || $('pad').style.display === 'none') return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫');
});

/* ---------- SESLİ KAYIT ----------
   Telefonun kendi konuşma tanıması (Web Speech API), ücretsiz. Desteklenmezse buton gizlenir;
   klavyedeki mikrofon (dikte) her zaman çalışır. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const micBtn = id => SR ? `<button class="mic" id="${id}" type="button" aria-label="Sesli kayıt">🎙</button>` : '';
function stopMic(){ if (rec) { try { rec.stop(); } catch(e){} rec = null; } document.querySelectorAll('.mic.rec').forEach(m => m.classList.remove('rec')); }
function bindMic(btnId, targetId){
  const btn = $(btnId); if (!btn) return;
  btn.onclick = () => {
    if (rec) return stopMic();
    const target = $(targetId), base = target.value ? target.value.trim() + ' ' : '';
    rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = e => {
      target.value = base + [...e.results].map(r => r[0].transcript).join(' ');
      target.dispatchEvent(new Event('input'));
    };
    rec.onerror = e => { toast(e.error === 'not-allowed' ? 'Mikrofon izni verilmedi' : 'Ses tanınamadı, tekrar dene'); stopMic(); };
    rec.onend = () => stopMic();
    try { rec.start(); btn.classList.add('rec'); } catch(e) { toast('Sesli kayıt başlatılamadı'); rec = null; }
  };
}

/* ---------- GEÇMİŞTEKİ SEN ----------
   Önce ~1 ay önceki, yoksa ~1 hafta önceki girişi gösterir. */
function renderPast(){
  const age = h => Math.round((Date.now() - new Date(h.date)) / 864e5);
  const pool = S.history.filter(h => h.note || h.mood);
  const pick = pool.find(h => Math.abs(age(h) - 30) <= 3) || pool.find(h => Math.abs(age(h) - 7) <= 1);
  const el = $('pastCard');
  if (!pick) { el.style.display = 'none'; return; }
  const a = age(pick), when = a >= 25 ? 'Bir ay önce bugün' : 'Bir hafta önce bugün';
  const doneTxt = { yes:'✓ yaptın', part:'◐ kısmen', no:'✕ yapamadın' }[pick.done];
  el.style.display = '';
  el.innerHTML = `<div class="label">Geçmişteki sen</div>
    <div class="when">${when} · ${fmtDate(pick.date)}</div>
    ${pick.note ? `<div class="quote">“${esc(pick.note)}”</div>` : ''}
    ${pick.mood ? `<div class="meta"><span>Ruh hali <b>${pick.mood}</b></span><span>Motivasyon <b>${pick.motivation}</b></span><span>Stres <b>${pick.stress}</b></span></div>` : ''}
    ${pick.intention ? `<div class="meta"><span>“${esc(pick.intention)}” — ${doneTxt || 'kontrol edilmedi'}</span></div>` : ''}`;
}

/* ---------- GELECEKTEKİ SANA MEKTUP ---------- */
const isReady = l => new Date(l.openAt) <= new Date();
function renderLetters(){
  const ls = [...S.letters].sort((a, b) => new Date(a.openAt) - new Date(b.openAt));
  $('letters').innerHTML = ls.length ? ls.map(l => {
    const r = isReady(l);
    const sub = r ? (l.opened ? `Açıldı · ${fmtDate(l.written)} tarihinde yazdın` : 'Açılmaya hazır') : `${fmtDate(l.openAt)} tarihinde açılacak`;
    return `<button class="letter ${r?'ready':''}" data-letter="${l.id}"><div style="display:flex;gap:12px;align-items:center"><div class="ic">${r ? (l.opened?'✉':'✦') : '🔒'}</div><div><p>${fmtDate(l.written)} tarihli mektup</p><small>${sub}</small></div></div><span style="color:var(--faint)">${r?'→':''}</span></button>`;
  }).join('') : '<div class="empty">Henüz mektup yok.</div>';
  $('letters').querySelectorAll('[data-letter]').forEach(b => b.onclick = () => {
    const l = S.letters.find(x => x.id == b.dataset.letter);
    isReady(l) ? readLetter(l) : toast(`Mühürlü · ${fmtDate(l.openAt)} tarihinde açılacak`);
  });
}
function renderLetterReady(){
  const l = S.letters.find(x => isReady(x) && !x.opened);
  $('letterReady').innerHTML = l ? `<div class="card ready-card"><button class="cta hot" id="openReady"><div><div class="label">Geçmişten bir mektup</div><div class="intent">${fmtDate(l.written)} tarihinde kendine yazdığın mektup açılmaya hazır.</div></div><div class="arrow">✦</div></button></div>` : '';
  if (l) $('openReady').onclick = () => readLetter(l);
}
function readLetter(l){
  if (!l.opened) { l.opened = true; saveLetter(l); }
  openSheet(`<h2>Geçmişteki senden</h2><div class="sub">${fmtDate(l.written)} tarihinde yazdın</div>
    <div class="paper">${esc(l.text)}</div><button class="save" id="lc">Kapat</button>`,
    () => $('lc').onclick = () => { closeSheet(); renderToday(); renderLetters(); });
}
function letterSheet(){
  let months = 3;
  openSheet(`<h2>Gelecekteki sana</h2><div class="sub">Yazdığın an mühürlenir, zamanı gelene kadar sen de okuyamazsın.</div>
    <div class="field"><div class="inwrap"><textarea class="inp" id="lt" style="min-height:180px" placeholder="Sevgili gelecekteki ben…"></textarea>${micBtn('ltMic')}</div></div>
    <div class="field"><div class="label">Ne zaman açılsın?</div>
      <div class="seg" id="lm"><button data-v="1">1 ay</button><button data-v="3" class="on">3 ay</button><button data-v="6">6 ay</button><button data-v="12">1 yıl</button></div></div>
    <button class="save" id="ls" disabled>Mühürle</button>`, () => {
      segBind($('lm'), v => months = +v); bindMic('ltMic', 'lt');
      $('lt').oninput = e => $('ls').disabled = !e.target.value.trim();
      $('ls').onclick = () => {
        const d = new Date(); d.setMonth(d.getMonth() + months);
        const l = { id: Date.now(), written: new Date().toISOString(), openAt: d.toISOString(), opened: false, text: $('lt').value.trim() };
        S.letters.push(l); saveLetter(l);
        closeSheet(); renderLetters(); toast(`Mühürlendi · ${fmtDate(d.toISOString())} tarihinde açılacak`);
      };
  });
}
$('writeLetter').onclick = letterSheet;

/* ---------- DIŞA AKTARMA ----------
   Tüm veri JSON olarak indirilir (PIN hariç). Mühürlü mektuplar da dahil — veri senin. */
function exportData(){
  const { streak, ...data } = S;
  const blob = new Blob([JSON.stringify({ app:'ME', exportedAt:new Date().toISOString(), ...data }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ME-yedek-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Yedek indirildi');
}

/* ---------- NAV ---------- */
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-go]').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $('s-' + b.dataset.go).classList.add('on');
  if (b.dataset.go === 'ben') renderBen(); else renderToday();
  $('quick').style.display = b.dataset.go === 'bugun' ? '' : 'none';
  window.scrollTo(0, 0);
});
document.querySelectorAll('[data-sign]').forEach(b => b.onclick = () => momentSheet(b.dataset.sign));
$('morningCta').onclick = morningSheet;
$('eveningCta').onclick = eveningSheet;

buildPad(); // ekranlar giriş + veri yüklendikten sonra çizilir (onAuthStateChanged)
</script>
